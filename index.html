<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram VIP Message Styler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
      /* Custom scrollbar to match the new design */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0F0529;
      }
      ::-webkit-scrollbar-thumb {
        background: #a855f7; /* purple-500 */
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c084fc; /* purple-400 */
      }

      /* -- Animation Keyframes -- */
      @keyframes subtle-glow {
        0%, 100% {
          box-shadow: 0 0 15px rgba(var(--glow-color), 0.5), 0 0 25px rgba(var(--glow-color), 0.3);
        }
        50% {
          box-shadow: 0 0 25px rgba(var(--glow-color), 0.7), 0 0 40px rgba(var(--glow-color), 0.5);
        }
      }
      
      @keyframes pulse-border {
        0% { border-color: rgba(139, 92, 246, 0.6); }
        50% { border-color: rgba(56, 189, 248, 0.8); }
        100% { border-color: rgba(139, 92, 246, 0.6); }
      }

      @keyframes scale-in {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes pulse-lite {
        50% {
          transform: scale(1.03);
          opacity: .85;
        }
      }

      /* -- Animated Classes -- */
      .btn-glow-green {
        --glow-color: 74, 222, 128; /* green-400 */
        animation: subtle-glow 2.5s infinite ease-in-out;
      }

      .input-focus-animation {
         animation: pulse-border 2s infinite;
      }
      
      .animate-scale-in {
        animation: scale-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      
      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }

      .font-poppins {
        font-family: 'Poppins', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-[#0F0529] bg-fixed" style="background-image: radial-gradient(at 15% 15%, hsla(280, 80%, 15%, 0.4) 0px, transparent 50%), radial-gradient(at 80% 20%, hsla(300, 80%, 20%, 0.3) 0px, transparent 50%), radial-gradient(at 75% 85%, hsla(240, 75%, 25%, 0.3) 0px, transparent 50%), radial-gradient(at 10% 90%, hsla(260, 80%, 18%, 0.4) 0px, transparent 50%); font-family: 'Inter', sans-serif, system-ui;">
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
